<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Ordering App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>
  <body class="bg-light" onload="loadMenu()">

    <script>

    let loggedIn = localStorage.getItem("loggedIn");

    if (loggedIn != "true") {

        window.location.href = "login.html";

    }

    </script>


    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="menu.html">
          FoodExpress
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="menu.html">
                Menu
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="orders.html">
                Orders
              </a>
            </li>

            <li class="nav-item ms-2">
              <a class="btn btn-light" href="cart.html">
                Cart <span id="cartCount">0</span>
              </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="admin-login.html">
                    Admin
                </a>
            </li>

            <li class="nav-item">
                <span class="nav-link" id="welcomeUser"></span>
            </li>

            <li class="nav-item">
                <button class="btn btn-light ms-2" onclick="userLogout()">
                Logout
                </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-4">
      <h1 class="text-center">
        Food Menu
      </h1>

      <p class="text-center">
        Select your favourite food
      </p>

      <!-- Food categories -->

      <div class="text-center mb-4 d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-primary" id="allBtn"
        onclick="showCategory('all')">
            All
        </button>

        <button class="btn btn-outline-primary" id="burgerBtn"
        onclick="showCategory('burger')">
            Burger
        </button>

        <button class="btn btn-outline-primary" id="pizzaBtn"
        onclick="showCategory('pizza')">
            Pizza
        </button>

        <button class="btn btn-outline-primary" id="biryaniBtn"
        onclick="showCategory('biryani')">
            Biryani
        </button>

        <button class="btn btn-outline-primary" id="coldDrinksBtn"
        onclick="showCategory('cold drinks')">
        Cold Drinks
        </button>

        <button class="btn btn-outline-primary" id="moreItemsBtn" 
        onclick="showCategory('more items')">
        More Items
        </button>

        
      </div>

      <!-- Food Items -->

    <div id="foodContainer" class="row g-4">

    </div>


    <script>

    function showWelcomeUser() {

        let email = localStorage.getItem("userEmail");

        let users =
            JSON.parse(localStorage.getItem("users")) || [];

        for (let i = 0; i < users.length; i++) {

            if (users[i].email == email) {

                document.getElementById("welcomeUser").innerHTML =
                    "Welcome, " + users[i].name;

                break;
            }
        }
    }


    function userLogout() {

        localStorage.removeItem("loggedIn");

        localStorage.removeItem("userEmail");

        alert("Logged out successfully!");

        window.location.href = "login.html";

    }


    showWelcomeUser();

</script>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="cart.js"></script>

    <!-- <script src="script.js"></script> -->
  </body>
</html>
