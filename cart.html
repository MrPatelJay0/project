<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>My Cart</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light" onload="showCart()">
    <script>
      let loggedIn = localStorage.getItem("loggedIn");

      if (loggedIn != "true") {
        window.location.href = "login.html";
      }
    </script>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="menu.html"> FoodExpress </a>

        <a href="menu.html" class="btn btn-light"> Back to Menu </a>
      </div>
    </nav>

    <!-- Cart -->
    <div class="container mt-5">
      <h1 class="text-center mb-4">My Cart</h1>

      <!-- Cart item -->
      <div id="cartItems"></div>

      <!-- Total -->
      <div class="card">
        <div class="card-body text-end">
          <h4 id="total">Total: ₹0</h4>

          <button class="btn btn-primary" onclick="placeOrder()">
            Place Order
          </button>
        </div>
      </div>
    </div>

    <script src="cart.js"></script>
  </body>
</html>
